##################################################################################
# physical-exploration environment (flash_rl/envs/pxp.py)
##################################################################################

env_type: 'pxp'
env_name: 'pxp'          # the pxp run name (set by pxp's adapter)
pxp_config: null         # <run dir>/pxp_config.json written by `python -m pxp.run --write`
num_env_steps: ${num_env_steps}

seed: ${seed}
num_train_envs: ${num_train_envs}
num_eval_envs: ${num_eval_envs}
num_record_envs: ${num_record_envs}
rescale_action: null
max_episode_steps: null
